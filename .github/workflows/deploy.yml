name: Build and Deploy to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hw_vpe03_githubactions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_full_name: ${{ steps.meta.outputs.image_full_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: meta
        shell: bash
        run: |
          IMAGE_NAMESPACE="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          echo "image_full_name=${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_full_name }}:latest
            ${{ steps.meta.outputs.image_full_name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on remote server over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ needs.build-and-push.outputs.image_full_name }}:latest
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: REGISTRY,IMAGE,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            docker login "$REGISTRY" -u "$GHCR_USERNAME" -p "$GHCR_READ_TOKEN"
            docker pull "$IMAGE"
            docker stop fastapi-time || true
            docker rm fastapi-time || true
            docker run -d \
              --name fastapi-time \
              --restart unless-stopped \
              -p 8000:8000 \
              "$IMAGE"
